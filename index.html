<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFOOFT Recipes</title>
<meta name="theme-color" content="#b5432a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AFOOFT">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="app" data-view="list">
  <aside class="sidebar" id="sidebar">
    <div class="brand">AFOOFT <span>Recipes</span></div>
    <nav id="categories" class="categories" aria-label="Categories"></nav>
    <button class="side-link" id="settingsBtn">⚙︎ Editing settings</button>
  </aside>

  <section class="list-pane" aria-label="Recipes">
    <header class="list-head">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Categories">☰</button>
      <div class="search">
        <input id="search" type="search" placeholder="Search recipes or ingredients" autocomplete="off">
      </div>
      <button class="icon-btn" id="addBtn" aria-label="Add a recipe" title="Add a recipe">＋</button>
    </header>
    <div class="list-meta"><span id="listTitle">All recipes</span> <span id="listCount" class="muted"></span></div>
    <ul id="list" class="recipe-list"></ul>
  </section>

  <main class="detail-pane" id="detail" aria-live="polite">
    <div class="empty-detail">Pick a recipe to start cooking.</div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<script src="app.js"></script>
</body>
</html>
